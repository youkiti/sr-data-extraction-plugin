# CI-1（docs/test-strategy.md §4）: typecheck + jest（カバレッジ 100% 込み）+ test:tools + lint + lint:css + dev ビルド + 本番バンドル予算。
# CI-2 導入済み（2026-07-03）: Playwright E2E を e2e ジョブとして check と並列実行する
name: CI

on:
  push:
    branches: [master]
  pull_request:
  # push トリガーは master のみのため、作業ブランチ上で手動実行して green を確認する用途
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: 依存関係のインストール
        run: npm ci
      - name: 型検査
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: 自動生成ファイルの鮮度（docs/project-facts.md）
        run: npm run facts:check
      - name: 自動生成ファイルの鮮度（THIRD_PARTY_NOTICES.md）
        run: npm run licenses:check
      - name: stylelint
        run: npm run lint:css
      - name: jest（カバレッジ 100% 強制）
        run: npm test
      - name: ストア API ツールの単体テスト
        run: npm run test:tools
      - name: dev ビルド検証（作業原則 7）
        run: npm run dev
      - name: 本番ビルド（サイズ計測用）
        env:
          WEBAUTH_CLIENT_ID: bundle-budget-check.apps.googleusercontent.com
        run: npm run build -- --profile --json=/tmp/bundle-stats.json
      - name: バンドル予算の検査
        run: npm run bundle:check -- /tmp/bundle-stats.json

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: 依存関係のインストール
        run: npm ci
      - name: Playwright ブラウザの取得
        run: npx playwright install --with-deps chromium
      # E2E は spec 内で合成する minimal PDF を stub 配信するため、実 PDF fixture の取得（fetch-pdfs.ps1）は不要
      - name: Playwright E2E
        run: npm run test:e2e
